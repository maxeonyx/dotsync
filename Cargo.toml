[package]
name = "dotsync"
version = "0.4.5"
edition = "2021"
description = "Agent-first dotfile sync with scope branches and merge cascades"
license = "MIT"
repository = "https://github.com/maxeonyx/dotsync"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5.31", features = ["derive"] }
gix = "0.80"
jj-lib = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { version = "3.1.2", default-features = false, features = ["text"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt"] }
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2"
help-test = { git = "https://github.com/maxeonyx/help-test", tag = "v0.1.0" }
tempfile = "3.18"
