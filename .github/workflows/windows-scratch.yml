name: Windows scratch
on:
  push:
    branches: [windows-tests]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run every test the ledger expects to pass
        shell: bash
        run: |
          filter='not test(tdd_ratchet_gatekeeper)'
          for name in $(jq -r '.tests | to_entries[] | select(.value == "pending") | .key | sub(".*\\$"; "")' .test-status.json); do
            filter="$filter and not test(=$name)"
          done
          echo "$filter"
          cargo nextest run --no-fail-fast -E "$filter"
