name: CI

on:
  push:
    branches: [main]
    # Broad on purpose: anything that can break a build, a test or the published
    # site should be checked here. Whether a push also publishes a *release* is a
    # narrower question, answered by ARTIFACT_FILES/ARTIFACT_DIRS in
    # scripts/check_main_version_bump.py. Those must stay a subset of this list,
    # and scripts/test_check_main_version_bump.py checks that they are.
    paths:
      - .github/workflows/ci.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - scripts/**
      - .test-status.json
      - rust-toolchain.toml
      - devenv.*
      - docs/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare workspace path dependencies
        run: |
          mkdir -p ../../crates
          git clone --depth=1 https://github.com/maxeonyx/agent-tools ../../agent-tools-deps
          cp -R ../../agent-tools-deps/crates/agent-tools-updater ../../crates/agent-tools-updater
          cp -R ../../agent-tools-deps/crates/help-test ../../crates/help-test
          mkdir -p ../../ratchet-install/tools ../../ratchet-install/crates
          git clone --depth=1 https://github.com/maxeonyx/tdd-ratchet-rs ../../ratchet-install/tools/tdd-ratchet
          cp -R ../../agent-tools-deps/crates/help-test ../../ratchet-install/crates/help-test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Enforce main version bump
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/check_main_version_bump.py range --base ${{ github.event.before }} --head ${{ github.sha }}
      - name: Test the release guard
        run: python3 scripts/test_check_main_version_bump.py
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Install cargo-ratchet
        run: |
          cargo install --path ../../ratchet-install/tools/tdd-ratchet --locked
          cargo install cargo-nextest --locked
      - name: Run tests (ratchet)
        run: cargo ratchet

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: dotsync
            asset: dotsync-x86_64-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: dotsync.exe
            asset: dotsync-x86_64-windows.exe

    steps:
      - uses: actions/checkout@v6

      - name: Prepare workspace path dependencies
        run: |
          mkdir -p ../../crates
          git clone --depth=1 https://github.com/maxeonyx/agent-tools ../../agent-tools-deps
          cp -R ../../agent-tools-deps/crates/agent-tools-updater ../../crates/agent-tools-updater
          cp -R ../../agent-tools-deps/crates/help-test ../../crates/help-test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare asset (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Prepare asset (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Read version from Cargo.toml
        id: version
        run: echo "tag=v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, so this push changed nothing that feeds the binary. Nothing to publish."
            exit 0
          fi
          gh release create "$tag" artifacts/*/* --title "$tag" --generate-notes

  pages:
    name: Pages
    runs-on: ubuntu-latest
    # After the release, not alongside it: the site publishes docs/version.json,
    # which the agent-tools umbrella reads to decide what the current release is.
    # If publishing the release fails, the site must not start advertising it.
    needs: [release]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site content
        run: |
          rm -rf _site
          mkdir -p _site/releases
          cp -R docs/. _site/
          cp artifacts/*/* _site/releases/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
